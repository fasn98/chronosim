# Information about the original article that has been replicated
replication:
 - cite: "Kim, S.-W. & Thorne, K. S. (1991). Do vacuum fluctuations prevent the creation of closed timelike curves? Physical Review D 43, 3929-3947."
 - bib:  kim1991
 - url:  https://doi.org/10.1103/PhysRevD.43.3929
 - doi:  10.1103/PhysRevD.43.3929

# Don't forget to surround abstract with double quotes
abstract: "Kim and Thorne (1991) computed the renormalized stress-energy of a conformally coupled massless scalar field near the Cauchy horizon of a two-mouth wormhole time machine and found that it diverges as the inverse cube of the distance to the horizon. This paper replicates the computational part of that work: every closed-form result the article derives (the covering-space geometry, the defocusing factors, the stress-energy at the throat and between the mouths, the polarized hypersurfaces and the four-momentum) is recomputed by an independent numerical route from the article's own starting expressions, with arbitrary-precision arithmetic, and compared with the printed result. All of them are reproduced, with residuals that have the form of the terms the article declares neglected. Three inconsistencies in the printed text are documented. The point-splitting operator as printed (eq. 4a) lacks a factor 1/2 relative to the convention that reproduces both a thermal state and the Unruh value; the printed results carry that normalization consistently, so they are reproduced by the operator as printed and lie a factor of two above the arbiters' convention. Two equations (31 and 52) are inconsistent with their own context, and one order-of-magnitude value after eq. 14 does not follow from the inputs printed beside it. None of these changes the article's qualitative conclusions. Every number in this paper carries a machine-checked origin (cited, derived, computed or heuristic), and a test forbids any random number generator in the package."

